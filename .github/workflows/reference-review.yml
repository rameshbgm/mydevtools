name: Reference source review
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-reference-sources.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-source-review
          path: reference-source-report.json
          retention-days: 90
